<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="Amandi Chamathsara Monogram Logo">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#152126" />
      <stop offset="100%" stop-color="#0b1114" />
    </radialGradient>

    <!-- Turquoise Gradient for 'A' Left Stroke & Circle -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41bba8" />
      <stop offset="100%" stop-color="#1b6b62" />
    </linearGradient>

    <!-- Glowing Effect for the Outer Ring -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Round Background -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" />

  <!-- Glowing Outer Turquoise Ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#tealGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Logo Icon: Monogram 'A' -->
  <g id="monogram-a">
    <!-- Right White Leg -->
    <polygon points="250,110 350,300 290,300" fill="#FFFFFF" />
    
    <!-- Left Curved Turquoise Leg & Wave -->
    <path d="M250,110 L140,300 C180,300 200,280 230,240 C280,180 340,180 370,195 C330,225 270,225 220,250 Z" fill="url(#tealGrad)" />
  </g>

  <!-- Typography: Name -->
  <text x="250" y="340" font-family="&#39;Poppins&#39;, &#39;Montserrat&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
    AMANDI CHAMATHSARA
  </text>

  <!-- Divider Line & Center Accent Dot -->
  <g id="divider">
    <line x1="130" y1="365" x2="230" y2="365" stroke="#2c8276" stroke-width="2" stroke-linecap="round" />
    <circle cx="250" cy="365" r="5" fill="#3fbdae" />
    <line x1="270" y1="365" x2="370" y2="365" stroke="#2c8276" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
